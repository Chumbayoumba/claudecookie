# Googlebot extracted React list keys (href+label) from the RSC payload
# and crawled them as real URLs. Location matching uses the decoded URI.
location ^~ /ru/privacy/Конфиденциальность {
    include snippets/claudecookie-security.conf;
    return 301 /ru/privacy/;
}
location ^~ /zh/privacy/隐私政策 {
    include snippets/claudecookie-security.conf;
    return 301 /zh/privacy/;
}
location ^~ /privacy/Privacy {
    include snippets/claudecookie-security.conf;
    return 301 /privacy/;
}
