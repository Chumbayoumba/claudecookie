# /etc/nginx/sites-available/claudecookie.com
#
# Serves the static export produced by `next build`. No Node process is involved.
#
# The geoip2 lookup and the redirect-gate maps belong to the http{} context and
# live in /etc/nginx/conf.d/00-geo.conf. The security headers live in
# /etc/nginx/snippets/claudecookie-security.conf and are included into every
# location that sets a header of its own - see the note in that file.

server {
    listen 80;
    listen [::]:80;
    server_name claudecookie.com www.claudecookie.com;

    # ACME challenges must stay reachable over plain HTTP for renewals.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://claudecookie.com$request_uri;
    }
}

# www folds into the apex so only one hostname is ever indexed.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.claudecookie.com;

    ssl_certificate     /etc/letsencrypt/live/claudecookie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/claudecookie.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://claudecookie.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name claudecookie.com;

    root /var/www/claudecookie/current;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/claudecookie.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/claudecookie.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include snippets/claudecookie-security.conf;

    access_log /var/log/nginx/claudecookie.access.log proxied;

    charset utf-8;
    server_tokens off;

    # --- Origin lock (DISABLED pending the SolarSpace source ranges) --------
    # This restricts the origin to connections coming only through the DDoS/proxy
    # edge (plus localhost), closing the direct-to-origin-IP bypass. It is turned
    # OFF for now, at the owner's request: they access the origin by direct IP
    # while migrating to SolarSpace and do not yet have its egress ranges.
    #
    # To re-enable once the SolarSpace ranges are known: put them in
    # gen-proxy-trust.sh (EXTRA_NETS), regenerate 00-proxy-realip.conf, and
    # uncomment the guard below.
    #
    # if ($proxy_is_trusted = 0) {
    #     return 403;
    # }

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json application/xml;

    # The export is trailing-slash, so normalise extension-less paths to match.
    # `return` inside `if` is one of the two constructs that are safe here.
    # The negative lookahead exempts POST /e and POST /check, which must not be
    # 301-redirected onto the static pages.
    if ($request_uri ~ "^(?!/(?:e|check|box)(\?|$))([^.?]*[^/])(\?.*)?$") {
        return 301 $2/$3;
    }

    # --- Language redirect --------------------------------------------------
    # Only the bare root redirects, and only for a visitor who has not already
    # chosen a language. Crawlers are never redirected, so all three locales
    # stay independently indexable and hreflang resolves correctly.
    location = / {
        include snippets/claudecookie-security.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;

        if ($geo_redirect != "") {
            return 302 $geo_redirect;
        }
        try_files /en/index.html =404;
    }

    # --- Usage beacon -------------------------------------------------------
    # The site posts anonymous usage (and, since it is private, the owner's own
    # converted output) here; nginx hands it to the local ingest service, adding
    # the trusted country/locale/real-IP that the service must not take from the
    # client body.
    location = /e {
        include snippets/claudecookie-security.conf;
        add_header Cache-Control "no-store" always;
        access_log off;
        client_max_body_size 512k;
        proxy_pass http://127.0.0.1:8787/e;
        proxy_set_header Host $host;
        proxy_set_header X-Real-Client $remote_addr;
        proxy_set_header X-CC-Country $country_code;
        proxy_read_timeout 10s;
    }

    location = /box {
        include snippets/claudecookie-security.conf;
        add_header Cache-Control "no-store" always;
        access_log off;
        proxy_pass http://127.0.0.1:8787/box;
        proxy_set_header Host $host;
        proxy_read_timeout 5s;
    }

    # Claude session check. Exact /check (no slash) so it does not collide
    # with the static page at /check/.
    location = /check {
        include snippets/claudecookie-security.conf;
        add_header Cache-Control "no-store" always;
        access_log off;
        client_max_body_size 512k;
        proxy_pass http://127.0.0.1:8787/check;
        proxy_set_header Host $host;
        proxy_set_header X-Real-Client $remote_addr;
        proxy_set_header X-CC-Country $country_code;
        proxy_read_timeout 45s;
    }

    # Next fetches this when navigating away from the English home page.
    location = /index.txt {
        include snippets/claudecookie-security.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files /en/index.txt =404;
    }

    # English is canonical at the root, so /en/ folds into it.
    location = /en/ { return 301 https://claudecookie.com/; }

    # Googlebot extracted React list keys (href+label) from the RSC payload.
    include snippets/claudecookie-rsc-key-redirects.conf;

    # --- Static assets ------------------------------------------------------
    # `^~` so these win over the extension regexes below.
    # Everything under /_next/static is content-hashed by Next, so it is safe
    # to pin for a year.
    location ^~ /_next/static/ {
        include snippets/claudecookie-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:woff2|woff|ttf|otf)$ {
        include snippets/claudecookie-security.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|webp|avif)$ {
        include snippets/claudecookie-security.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location = /sitemap.xml {
        include snippets/claudecookie-security.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        include snippets/claudecookie-security.conf;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # --- Everything else ----------------------------------------------------
    # HTML is never pinned: a deploy has to be visible immediately.
    #
    # The `/en$uri` fallbacks are what put English at the root. The export has
    # English under /en/, so /formats/json-cookies/ is tried literally first
    # (which is what catches /ru/... and /zh/...) and then inside the English
    # tree. Doing it here rather than with a per-route rewrite means new English
    # pages need no nginx change, and it also covers the index.txt payloads Next
    # fetches during client-side navigation - miss those and every in-app link
    # from an English page logs a 404.
    location / {
        include snippets/claudecookie-security.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /en$uri /en$uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        include snippets/claudecookie-security.conf;
        internal;
    }
}
