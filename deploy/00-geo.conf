# /etc/nginx/conf.d/00-geo.conf
#
# Country lookup and the language-redirect gate. These directives belong to the
# http{} context, which is why they live here rather than in the server block.
#
# The country is taken from the first source that has an answer:
#
#   1. X-Country-Code  - sent by RTK web protection
#   2. CF-IPCountry    - sent by Cloudflare
#   3. the offline DB-IP database, keyed on the restored client address
#
# The headers come first because they are the provider's own lookup: always
# current, and measurably better than the free monthly database, which was
# observed returning nothing at all for live Russian addresses.
#
# Both headers are only honoured when the request actually arrived from one of
# the trusted proxy networks - $proxy_is_trusted, defined in
# 00-proxy-realip.conf, tests the pre-rewrite address. Otherwise anyone hitting
# the origin IP directly could pick their own country by setting a header.

# --- Source 1: RTK web protection -------------------------------------------

map $proxy_is_trusted $rtk_country_raw {
    default "";
    "1"     $http_x_country_code;
}

map $rtk_country_raw $rtk_country {
    default $rtk_country_raw;
    ""      "";
    "XX"    "";
    "--"    "";
}

# --- Source 2: Cloudflare ----------------------------------------------------

map $proxy_is_trusted $cf_country_raw {
    default "";
    "1"     $http_cf_ipcountry;
}

# XX means Cloudflare could not place the address; T1 marks a Tor exit. Both are
# treated as no answer so the next source gets a turn.
map $cf_country_raw $cf_country {
    default $cf_country_raw;
    ""      "";
    "XX"    "";
    "T1"    "";
}

# --- Whichever proxy is in front --------------------------------------------

map $rtk_country $proxy_country {
    default $rtk_country;
    ""      $cf_country;
}

# --- The safety guard --------------------------------------------------------
#
# $client_unresolved is defined in 00-proxy-realip.conf, next to the list of
# trusted proxy networks it is derived from. It is non-empty when $remote_addr
# is still a proxy address, meaning no forwarded header arrived and we have no
# idea where the visitor is. Geolocating the proxy itself would send the whole
# world to whichever country the scrubbing centre sits in.

# --- Country -> locale -------------------------------------------------------

map $country_code $geo_locale {
    default "";

    RU "/ru/";
    BY "/ru/";
    KZ "/ru/";
    KG "/ru/";
    AM "/ru/";

    CN "/zh/";
    TW "/zh/";
    HK "/zh/";
    MO "/zh/";
    SG "/zh/";
}

# A visitor who has picked a language must never be redirected again.
map $http_cookie $lang_pref {
    default "";
    "~*(?:^|;\s*)cclang=" "pinned";
}

# Crawlers are never redirected: Google, Yandex and Baidu each need to reach
# every locale directly for hreflang to work.
map $http_user_agent $is_bot {
    default "";
    "~*(googlebot|bingbot|yandex|duckduckbot|baiduspider|slurp|applebot|ahrefsbot|semrushbot|mj12bot|petalbot|sogou|bytespider|facebookexternalhit|twitterbot|linkedinbot|telegrambot|whatsapp|discordbot|gptbot|oai-searchbot|chatgpt-user|claudebot|perplexitybot|amazonbot)" "bot";
}

# Redirect only when no gate is tripped: no saved preference, not a crawler, and
# the client address was actually resolved. Any non-empty part means "stay put".
map "$lang_pref$is_bot$client_unresolved" $geo_redirect {
    default $geo_locale;
    "~."    "";
}
