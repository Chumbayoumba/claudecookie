# Appended to 00-geo.conf when the geoip2 nginx module is NOT available.
#
# The country then comes only from whichever proxy is in front. If neither sends
# a header, $country_code is empty, no locale matches, and every visitor gets
# the English root - degraded, but never wrong.
map $proxy_country $country_code {
    default $proxy_country;
}
