# /etc/nginx/conf.d/00-api-limit.conf
#
# Shared sliding window for the public JSON API. Must live in the http{}
# context (conf.d is included from there). The per-route location then applies
# `limit_req zone=cc_api burst=20 nodelay`.

limit_req_zone $binary_remote_addr zone=cc_api:10m rate=10r/s;
