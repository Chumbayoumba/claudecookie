# /etc/nginx/snippets/claudecookie-security.conf
#
# nginx's `add_header` does not merge: the moment a location adds a header of
# its own, every header inherited from the server block is dropped. So these are
# kept in one file and included into the server block *and* into every location
# that sets a Cache-Control header of its own. Leaving one out silently ships a
# page with no CSP.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# `connect-src 'self'` allows the same-origin usage beacon (POST /e) that feeds
# the private Telegram admin; nothing cross-origin is permitted. The site is
# access-locked at the edge, so this is the owner's own instrumentation.
#
# 'unsafe-inline' for scripts is unavoidable here - Next.js inlines its hydration
# payload, and a statically exported site has no request cycle in which to mint a
# nonce. The page renders no user-supplied HTML and loads no third-party code.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
