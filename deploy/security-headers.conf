# /etc/nginx/snippets/claudecookie-security.conf
#
# nginx's `add_header` does not merge: the moment a location adds a header of
# its own, every header inherited from the server block is dropped. So these are
# kept in one file and included into the server block *and* into every location
# that sets a Cache-Control header of its own. Leaving one out silently ships a
# page with no CSP.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
# CSP frame-ancestors 'none' already blocks framing on modern browsers; this
# covers older clients that only understand X-Frame-Options.
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# `connect-src 'self'` allows the same-origin usage beacon (POST /e), the
# box public key (GET /box) and the session check (POST /check).
#
# 'unsafe-inline' for scripts is unavoidable here - Next.js inlines its hydration
# payload, and a statically exported site has no request cycle in which to mint a
# nonce.
#
# Yandex Metrika (counter 112556703) + Webvisor are loaded site-wide at the
# owner's explicit request, so the CSP is relaxed for them:
#   script-src  += mc.yandex.ru yastatic.net   (tag.js + watch.js)
#   img-src     += mc.yandex.ru yastatic.net   (pixel + informer assets)
#   connect-src += mc.yandex.ru mc.webvisor.com mc.webvisor.org blob:  (hits + Webvisor upload)
#   frame-src / child-src for mc.yandex.ru + blob:                     (Webvisor iframe/worker)
# Trade-off on record: this admits third-party JavaScript onto pages that also
# handle live Claude session cookies. Revert these tokens to lock the origin back down.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru https://yastatic.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://mc.yandex.ru https://yastatic.net; font-src 'self'; connect-src 'self' https://mc.yandex.ru https://mc.webvisor.com https://mc.webvisor.org blob:; frame-src https://mc.yandex.ru; child-src https://mc.yandex.ru blob:; form-action 'none'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
