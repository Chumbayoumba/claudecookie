# Appended to 00-geo.conf when the geoip2 nginx module IS available.
#
# Third and last source: the offline DB-IP database, consulted only when neither
# proxy sent a country header. It reads $remote_addr, which 00-proxy-realip.conf
# has already rewritten to the true client address.
#
# Worth knowing: the free DB-IP Lite edition has real gaps - it was observed
# returning no country at all for live Russian addresses that RTK identified
# correctly. That is precisely why the provider headers are consulted first.
geoip2 /var/lib/geoip/dbip-country-lite.mmdb {
    auto_reload 24h;
    $geoip2_country_code source=$remote_addr country iso_code;
}

map $proxy_country $country_code {
    default $proxy_country;
    ""      $geoip2_country_code;
}
