# /etc/nginx/snippets/claudecookie-security-api.conf
#
# Same as claudecookie-security.conf, except:
#   - Cross-Origin-Resource-Policy is cross-origin so a foreign browser can
#     read the JSON (CORP same-origin would hide the body even with ACAO *).
#   - CORS headers for the public /api/v1/* surface.
# Do not include this snippet on /e, /check or /credential.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "cross-origin" always;
add_header Access-Control-Allow-Origin "*" always;
add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
add_header Access-Control-Allow-Headers "Content-Type" always;
add_header Access-Control-Max-Age "86400" always;
add_header Access-Control-Expose-Headers "Retry-After" always;
add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
